<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="60%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FB8C00" />
    </radialGradient>
    <linearGradient id="fortGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E" />
      <stop offset="100%" stop-color="#2D1E18" />
    </linearGradient>
    <linearGradient id="ribbonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="50%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#43A047" />
    </linearGradient>
    <linearGradient id="ribbonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="50%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Suncircles / Arch Heritage background -->
  <g transform="translate(150, 135)">
    <!-- Sun disk -->
    <path d="M -75,0 A 75,75 0 0,1 75,0 Z" fill="url(#sunGlow)" />

    <!-- Heritage Domes & Arch silhouette -->
    <path d="M -70,0 L -70,-20 Q -70,-35 -55,-35 Q -40,-35 -40,-20 L -40,0 
             M -30,0 L -30,-45 Q -30,-65 0,-65 Q 30,-65 30,-45 L 30,0 
             M 40,0 L 40,-20 Q 40,-35 55,-35 Q 70,-35 70,-20 L 70,0 Z" 
          fill="url(#fortGrad)" />

    <!-- Dome Finials -->
    <line x1="0" y1="-65" x2="0" y2="-76" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-77" r="3" fill="#FFD54F" />
    <line x1="-55" y1="-35" x2="-55" y2="-43" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" />
    <circle cx="-55" cy="-44" r="2" fill="#FFD54F" />
    <line x1="55" y1="-35" x2="55" y2="-43" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" />
    <circle cx="55" cy="-44" r="2" fill="#FFD54F" />

    <!-- Bridge Arches -->
    <rect x="-80" y="0" width="160" height="24" fill="#3E2723" rx="2" />
    <path d="M -60,24 A 14,14 0 0,1 -32,24 
             M -22,24 A 14,14 0 0,1 6,24 
             M 16,24 A 14,14 0 0,1 44,24 
             M 54,24 A 10,10 0 0,1 74,24" 
          fill="#FFF9C4" />

    <!-- QR Code Element on Left -->
    <g transform="translate(-78, -18) scale(0.68)">
      <rect x="0" y="0" width="30" height="30" fill="#FFFFFF" rx="4" />
      <!-- QR markers -->
      <rect x="3" y="3" width="10" height="10" fill="#212121" rx="1" />
      <rect x="5" y="5" width="6" height="6" fill="#FFFFFF" />
      <rect x="7" y="7" width="2" height="2" fill="#212121" />

      <rect x="17" y="3" width="10" height="10" fill="#212121" rx="1" />
      <rect x="19" y="5" width="6" height="6" fill="#FFFFFF" />
      <rect x="21" y="7" width="2" height="2" fill="#212121" />

      <rect x="3" y="17" width="10" height="10" fill="#212121" rx="1" />
      <rect x="5" y="19" width="6" height="6" fill="#FFFFFF" />
      <rect x="7" y="21" width="2" height="2" fill="#212121" />

      <rect x="16" y="16" width="4" height="4" fill="#212121" />
      <rect x="22" y="16" width="5" height="5" fill="#212121" />
      <rect x="16" y="22" width="5" height="5" fill="#212121" />
      <rect x="23" y="23" width="4" height="4" fill="#212121" />
    </g>

    <!-- Magnifying Glass / Discovery Node on Right -->
    <g transform="translate(48, -12) scale(0.9)">
      <!-- Handle -->
      <line x1="18" y1="18" x2="34" y2="34" stroke="#8D6E63" stroke-width="7" stroke-linecap="round" />
      <line x1="18" y1="18" x2="34" y2="34" stroke="#5D4037" stroke-width="4" stroke-linecap="round" />
      <!-- Ring -->
      <circle cx="10" cy="10" r="17" fill="#E1F5FE" stroke="#FFB300" stroke-width="4" />
      <circle cx="10" cy="10" r="14" fill="#E1F5FE" stroke="#FFF" stroke-width="1.5" />
      <!-- Scroll/Monument Inside Glass -->
      <path d="M 6,3 L 13,3 Q 16,3 16,7 L 16,14 Q 16,17 13,17 L 6,17 Q 4,17 4,14 L 4,6 Q 4,3 6,3 Z" fill="#FFE082" stroke="#FF8F00" stroke-width="1" />
      <line x1="7" y1="7" x2="13" y2="7" stroke="#FF8F00" stroke-width="1" />
      <line x1="7" y1="10" x2="13" y2="10" stroke="#FF8F00" stroke-width="1" />
      <line x1="7" y1="13" x2="11" y2="13" stroke="#FF8F00" stroke-width="1" />
    </g>

    <!-- Bottom Ribbon with Devanagari Script 'धरोहरसेतु' -->
    <g transform="translate(0, 24)">
      <!-- Green ribbon wing left -->
      <path d="M -88,14 Q -45,18 0,16 Q -50,30 -94,18 Z" fill="url(#ribbonGreen)" />
      <!-- Orange ribbon wing right -->
      <path d="M 0,16 Q 45,18 88,14 Q 94,18 50,30 Q 0,26 0,16 Z" fill="url(#ribbonOrange)" />
      <!-- Main banner background -->
      <path d="M -85,12 C -40,24 40,24 85,12 C 90,26 45,34 0,33 C -45,34 -90,26 -85,12 Z" fill="#1B5E20" />
      <path d="M -10,14 C 35,22 80,12 85,12 C 90,26 45,34 0,33 Z" fill="#D84315" />
      
      <!-- Text: धरोहरसेतु -->
      <text x="0" y="24" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">धरोहरसेतु</text>
    </g>
  </g>
</svg>
